server {
    listen 80;
    server_name kings-travel.tours www.kings-travel.tours;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kings-travel.tours www.kings-travel.tours;

    # SSL - do te plotësohet automatikisht nga certbot
    # ssl_certificate /etc/letsencrypt/live/kings-travel.tours/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kings-travel.tours/privkey.pem;

    client_max_body_size 20M;

    # API Server
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Flight Management System (FMS Pro)
    location /flight-system/ {
        proxy_pass http://localhost:18693/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Booking Engine (faqja publike)
    location / {
        proxy_pass http://localhost:24633/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
