# Only Vite's content-hashed assets; never HTML, version.json, sw.js or APIs.
<Directory "/root/artifacts/booking-engine/dist/public/assets">
  <FilesMatch "-[A-Za-z0-9_-]{8,}\.(js|css|webp|png|jpg|jpeg|svg|woff|woff2)$">
    Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} == 200 || %{REQUEST_STATUS} == 304"
  </FilesMatch>
</Directory>
<Directory "/root/artifacts/flight-system/dist/public/assets">
  <FilesMatch "-[A-Za-z0-9_-]{8,}\.(js|css|webp|png|jpg|jpeg|svg|woff|woff2)$">
    Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} == 200 || %{REQUEST_STATUS} == 304"
  </FilesMatch>
</Directory>
