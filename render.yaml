# Render Blueprint — Albania Sky / FMS
# Render → New → Blueprint → zgjidh repo-n albania-sky.
# Një shërbim i vetëm (Docker + Chromium): API + paneli (/flight-system/) + portali publik (/).
services:
  - type: web
    name: albania-sky-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Creates the schema on an empty database; does nothing if tables exist.
    preDeployCommand: cd /app && pnpm --filter @workspace/db run bootstrap
    region: frankfurt
    plan: starter
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTENDS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: albania-sky-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Vendosen me dorë në Render (sync: false = nuk ruhen në GitHub)
      - key: RAPIDAPI_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GMAIL_FROM
        sync: false
      - key: FMS_PUBLIC_BASE_URL
        sync: false

databases:
  - name: albania-sky-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
